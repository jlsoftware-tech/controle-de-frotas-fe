services:
  frontend-dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: development

    container_name: controle-de-frotas-dev

    ports:
      - "5174:5174"

    volumes:
      - .:/app
      - /app/node_modules
      - /app/.pnpm-store

    environment:
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"

    command: pnpm dev --host 0.0.0.0 --port 5174